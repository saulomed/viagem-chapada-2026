# Site estático: HTML pronto na pasta `site`, sem build step.
# O Netlify ainda precisa instalar as dependências das funções (package.json).
#
# Variáveis de ambiente obrigatórias (Project configuration → Environment variables):
#   SITE_PASSWORD   senha única do grupo (protege o site inteiro)
#   SESSION_SECRET  string aleatória longa para assinar o cookie de sessão
[build]
  publish = "site"
  command = ""

# /api/state devolve o estado compartilhado; nunca pode ser cacheado.
[[headers]]
  for = "/api/state"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# O HTML muda a cada revisão do roteiro — nunca servir de cache velho.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
