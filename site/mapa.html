nd": "agregador"}, "reservas-grupo": {"label": "Reservas fechadas pelo grupo — valores, datas e prazos de cancelamento informados por Saulo em 12/10/2026", "consultadoEm": "2026-10-12", "kind": "oficial"}, "reserva-ibicoara": {"label": "Reserva da Pousada Capão do Mel, Ibicoara — R$ 580 o quarto pelas duas noites, informado por Saulo em 15/10/2026", "consultadoEm": "2026-10-15", "kind": "oficial"}, "rotas-maps-16": {"label": "Google Maps — trechos remedidos em 16/10/2026: Lençóis → Gruta Lapa Doce 67,1 km · 1h22; Lapa Doce → Caverna Torrinha 2,7 km · 6 min; Torrinha → Lençóis 64,0 km · 1h21; Lençóis → Morro do Pai Inácio 29,2 km · 44 min; Ibicoara → Fazenda Pratinha 248 km · 3h49 pela BA-142 e BR-242; Pratinha → Lençóis 48,0 km · 1h10", "url": "https://www.google.com/maps/dir/Len%C3%A7%C3%B3is,+BA/Gruta+Lapa+Doce,+Iraquara,+BA/Caverna+Torrinha,+Iraquara,+BA/Len%C3%A7%C3%B3is,+BA", "consultadoEm": "2026-10-16", "kind": "agregador"}, "torrinha": {"label": "Caverna Torrinha — site oficial: aberta todos os dias das 8h às 17h, visitas guiadas de 40 min a 2h30, de R$ 30 a R$ 150 conforme o circuito", "url": "https://cavernatorrinha.com.br/", "consultadoEm": "2026-10-16", "kind": "oficial"}, "reserva-lencois-sitio": {"label": "Reserva da Hospedagem do Sítio, Lençóis, noites de 17 e 18/10 — R$ 660 o quarto pelas duas noites, informado por Saulo em 16/10/2026", "consultadoEm": "2026-10-16", "kind": "oficial"}}, "days": [{"num": 1, "date": "2026-10-17", "emoji": "🚗", "city": "Lençóis", "title": "Direto para Lençóis, e o resto do dia de boa", "route": "Juazeiro → Senhor do Bonfim → Capim Grosso → Lençóis", "location": "lencois", "blocks": [{"time": "06h30 – 15h · O DIA NA ESTRADA", "title": "🚗 Juazeiro → Lençóis", "items": ["BR-407 até o sul, passando por Senhor do Bonfim e Capim Grosso, e BR-242 para o oeste até a entrada de Lençóis. É o trecho mais longo da viagem.", "⚠️ <strong>489 km e 7h38 de volante.<\/strong> Saindo às 6h30, com cerca de 1h de paradas, a chegada fica por volta das 15h — com quase três horas de sol pela frente.", "💡 Abastecer e almoçar no caminho — <strong>Senhor do Bonfim<\/strong> (a ~2h15 de Juazeiro) e <strong>Capim Grosso<\/strong> têm a melhor estrutura da rota. Jacobina <strong>não<\/strong> está nesse caminho: fica 48 km fora, e só entra na volta, na sexta.", "💡 Chegar com o tanque em dia: o domingo soma ~190 km entre as grutas de Iraquara e o Pai Inácio.", "📍 <a href=\"https://www.google.com/maps/dir/Juazeiro%2C+BA/Len%C3%A7%C3%B3is%2C+BA\" target=\"_blank\">Google Maps<\/a> · <a href=\"https://www.waze.com/live-map/directions?to=ll.-12.5614%2C-41.3903\" target=\"_blank\">Waze<\/a>"], "duration": {"text": "489 km · 7h38", "status": "cotado", "source": "rotas-maps"}}, {"time": "15h – 18h · CHEGADA", "title": "🏨 Check-in na Hospedagem do Sítio e tarde livre", "items": ["<strong>Duas noites na mesma pousada<\/strong>: a mala só é desfeita uma vez até segunda, e o domingo sai e volta daqui.", "A pousada fica a 0,6 km do centro histórico — dá para ir a pé.", "💡 Hoje nada tem hora marcada. Depois de oito horas de estrada, o programa é descansar. Quem quiser dá uma volta a pé pelo centro antes de escurecer — o sol se põe às 17h42."], "attraction": "centro-historico-lencois"}, {"time": "19h em diante · NOITE", "title": "🍽️ Jantar no centro de Lençóis", "items": ["Tudo a pé a partir da pousada.", "⚠️ Não esticar: amanhã o carro sai às 7h30, porque no domingo a Lapa Doce só sai com grupo até as 12h."], "options": [{"title": "Quilombola", "text": "Godó de banana verde, cortado de palma. Cozinha baiana que quase não se acha fora daqui."}, {"title": "Volta pelo centro histórico iluminado", "text": "Mesa na calçada, costuma ter música ao vivo. Tudo a pé, sem pegar o carro."}, {"title": "Direto para a pousada", "text": "Escolha legítima: foram 489 km de estrada, e amanhã o dia começa cedo."}], "attraction": "quilombola"}]}, {"num": 2, "date": "2026-10-18", "emoji": "🕳️", "city": "Lençóis", "title": "Lapa Doce e Torrinha de manhã, Pai Inácio no fim da tarde", "route": "Lençóis → Iraquara (Lapa Doce e Torrinha) → Lençóis → Morro do Pai Inácio → Lençóis", "location": "lencois", "blocks": [{"time": "07h30 – 08h55 · MANHÃ", "title": "🚗 Lençóis → Gruta da Lapa Doce (Iraquara)", "items": ["BR-242 para o oeste, passando pela base do Pai Inácio, e depois a estrada de Iraquara.", "⚠️ <strong>No domingo a Lapa Doce fecha cedo:<\/strong> uma avaliação recente da própria página diz que o último grupo sai às 12h. O site oficial não publica horário — confirmar pelo WhatsApp da gruta, (75) 9 9821-9929, também a hora em que abre.", "📍 <a href=\"https://www.google.com/maps/dir/Len%C3%A7%C3%B3is%2C+BA/Gruta+Lapa+Doce%2C+Iraquara%2C+BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "67,1 km · 1h22", "status": "cotado", "source": "rotas-maps-16"}}, {"time": "09h – 11h · MANHÃ", "title": "🕳️ Gruta da Lapa Doce", "items": ["Caverna calcária com boca de 72 m de altura e ~850 m abertos à visitação, por salões amplos de formações. Percurso plano e arejado.", "⚠️ <strong>Visita guiada, com guia da própria gruta.<\/strong> Dura de 1h30 a 2h. O site oficial não publica tabela: os R$ 60 a R$ 80 por pessoa vêm das avaliações recentes.", "⚠️ Lanterna e calçado fechado — o chão é de terra e pedra, e o escuro é total longe da boca."], "price": {"text": "~R$ 60–80 por pessoa, com guia", "status": "estimado", "source": "lapa-doce"}, "tip": "Domingo: último grupo às 12h", "attraction": "gruta-da-lapa-doce"}, {"time": "11h – 12h · ALMOÇO", "title": "🍽️ Almoço no restaurante da Lapa Doce", "items": ["O complexo tem restaurante próprio, e a Torrinha fica a 2,7 km. Almoço sem esticar: a tarde tem dois relógios."]}, {"time": "12h15 – 13h30 · TARDE", "title": "💎 Caverna Torrinha", "items": ["A 2,7 km da Lapa Doce, 6 minutos de carro. É considerada a caverna de maior diversidade de formações do Brasil, com agulhas de aragonita e flores de gipsita que a Lapa Doce não tem.", "Aberta todos os dias, domingo inclusive, das 8h às 17h. A visita é guiada, com circuitos de 40 min a 2h30 — R$ 30 o mais simples, R$ 150 o completo. Reserva só para grupos grandes.", "⚠️ <strong>Escolher um circuito de até ~1h15.<\/strong> A saída para Lençóis é às 13h30, para sobrar descanso antes do Pai Inácio.", "📍 <a href=\"https://www.google.com/maps/dir/Gruta+Lapa+Doce%2C+Iraquara%2C+BA/Caverna+Torrinha%2C+Iraquara%2C+BA\" target=\"_blank\">Google Maps<\/a>"], "price": {"text": "R$ 30 a R$ 150 por pessoa, conforme o circuito", "status": "cotado", "source": "torrinha"}, "duration": {"text": "2,7 km · 6 min da Lapa Doce", "status": "cotado", "source": "rotas-maps-16"}, "attraction": "caverna-torrinha"}, {"time": "13h30 – 14h50 · TARDE", "title": "🚗 Torrinha → Lençóis", "items": ["BR-242 para o leste, passando de novo pela base do Pai Inácio.", "💡 Se as grutas atrasarem, ir direto ao Pai Inácio, que está no caminho, e deixar a pousada para depois do pôr do sol.", "📍 <a href=\"https://www.google.com/maps/dir/Caverna+Torrinha%2C+Iraquara%2C+BA/Len%C3%A7%C3%B3is%2C+BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "64,0 km · 1h21", "status": "cotado", "source": "rotas-maps-16"}}, {"time": "14h50 – 15h45 · DESCANSO", "title": "🏨 Pausa na pousada", "items": ["Banho, troca de roupa e um descanso. Às 15h45 o carro sai de novo."]}, {"time": "15h45 – 18h30 · FIM DE TARDE", "title": "⛰️ Pôr do sol no Morro do Pai Inácio", "items": ["⚠️ <strong>A subida só é liberada até as 17h.<\/strong> São 29,2 km e 44 min de Lençóis: saindo às 15h45, chega-se por volta das 16h30. Sair da pousada na hora.", "Subida de 20 a 30 minutos por escadaria e trilha curta até o platô, com vista de 360° para o Morro do Camelo e o Dois Irmãos.", "Pôr do sol às 17h42. Depois são os mesmos 29 km de BR-242 asfaltada de volta, já no escuro e com o grupo junto. Chegada a Lençóis por volta das 18h30.", "💡 A taxa subiu para R$ 20 em 06/04/2026 (meia a R$ 10). São R$ 80 pelos quatro, pagos na guarita.", "💡 Levar lanterna: a descida do platô acontece depois que o sol some.", "📍 <a href=\"https://www.google.com/maps/dir/Len%C3%A7%C3%B3is%2C+BA/Morro+do+Pai+In%C3%A1cio%2C+Palmeiras%2C+BA\" target=\"_blank\">Google Maps<\/a>"], "price": {"text": "R$ 20 por pessoa", "status": "cotado", "source": "pai-inacio-taxa"}, "duration": {"text": "29,2 km · 44 min de Lençóis", "status": "cotado", "source": "rotas-maps-16"}, "tip": "Subida até 17h", "attraction": "morro-do-pai-inacio"}, {"time": "19h em diante · NOITE", "title": "🍽️ Jantar em Lençóis", "items": ["Segunda noite na mesma pousada, e jantar no centro a pé.", "💡 Segunda não tem hora para sair de manhã — a única hora do dia é 12h30, no Poço Azul. Hoje dá para esticar."], "options": [{"title": "Volta pelo centro histórico iluminado", "text": "Mesa na calçada, costuma ter música ao vivo. Tudo a pé, sem pegar o carro."}, {"title": "Direto para a pousada", "text": "Escolha legítima: foram duas grutas, quase 200 km de carro e a subida do morro."}], "attraction": "centro-historico-lencois"}]}, {"num": 3, "date": "2026-10-19", "emoji": "💧", "city": "Mucugê", "title": "Poço Azul e o centro histórico de Mucugê", "route": "Lençóis → Poço Azul (Nova Redenção) → Mucugê", "location": "mucuge", "blocks": [{"time": "09h30 – 11h10 · MANHÃ", "title": "🚗 Lençóis → Poço Azul (Nova Redenção)", "items": ["Mudança de base: as malas vão no carro, a próxima cama é em Mucugê.", "💡 Manhã sem pressa. A única hora que manda no dia é 12h30.", "📍 <a href=\"https://www.google.com/maps/dir/Len%C3%A7%C3%B3is%2C%20BA/Po%C3%A7o%20Azul%2C%20Nova%20Reden%C3%A7%C3%A3o%2C%20BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "~95 km · ~1h40", "status": "cotado", "source": "rotas"}}, {"time": "11h30 – 14h · MEIO-DIA E ALMOÇO", "title": "💧 Poço Azul — flutuação na caverna alagada", "items": ["⚠️ <strong>Hora marcada de verdade:<\/strong> os raios de sol entram na água entre 12h30 e 14h, e a janela do ano fecha em 20/10.", "⚠️ A permanência na água é curta — 20 a 30 minutos por grupo. Chegar antes das 12h30 para pegar a vez dentro da janela.", "⚠️ Banho obrigatório antes de entrar, para tirar o protetor solar. Colete e máscara inclusos na taxa.", "💡 <strong>O almoço de hoje tem uma opção só:<\/strong> o APA Restaurante, a 200 m do poço, de comida caseira da região. A revisão de 12/10 não achou nenhum segundo restaurante avaliado em Nova Redenção. Se ele estiver fechado, o plano B é seguir e almoçar em Mucugê, por volta das 15h45.", "💡 <strong>Plano B:<\/strong> se a segunda amanhecer nublada, a terça 20 ainda está dentro da janela. De Mucugê são ~1h30 até o poço."], "price": {"text": "R$ 30 por pessoa", "status": "estimado", "source": "poco-azul"}, "tip": "Janela fecha 20/10", "attraction": "poco-azul"}, {"time": "14h15 – 15h45 · TARDE", "title": "🚗 Poço Azul → Mucugê", "items": ["Pela BA-245 até a BA-142, sentido sul. Chegada com mais de duas horas de sol pela frente.", "⚠️ Trecho medido só no roteador — conferir no Google Maps na véspera. Parte do acesso ao Poço Azul é de terra.", "📍 <a href=\"https://www.google.com/maps/dir/Po%C3%A7o%20Azul%2C%20Nova%20Reden%C3%A7%C3%A3o%2C%20BA/Mucug%C3%AA%2C%20BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "~66 km · ~1h30", "status": "estimado", "source": "rotas-osrm"}}, {"time": "16h – 18h · FIM DE TARDE", "title": "🏛️ Check-in e centro histórico de Mucugê", "items": ["Base de <strong>uma noite só<\/strong>: amanhã o parque municipal é de manhã, e o fim da tarde já é em Ibicoara.", "Conjunto tombado pelo IPHAN em 1980: cerca de 300 casas térreas e 10 sobrados do século XIX em três ruas planas. Tudo a pé, em 10 a 15 minutos de caminhada.", "A Igreja Matriz de Santa Isabel, de meados do século XIX, fica ao lado do centro.", "💡 O Cemitério Bizantino recebe iluminação à noite e fica na entrada da cidade — dá para vê-lo aceso hoje e visitá-lo com calma amanhã.", "🍽️ Jantar no centro. O <strong>Paraguassu<\/strong>, do chef André Chequer, fica na Rua Caetité, na mesma área tombada — cozinha contemporânea, das 19h às 23h. É a única noite em Mucugê: se for para jantar bem aqui, é hoje."], "attraction": "centro-historico-mucuge"}]}, {"num": 4, "date": "2026-10-20", "emoji": "⛏️", "city": "Ibicoara", "title": "Garimpo e cemitério de manhã, Ibicoara ao fim do dia", "route": "Mucugê — a pé — → Ibicoara", "location": "ibicoara", "blocks": [{"time": "08h30 – 12h30 · MANHÃ", "title": "⛏️ Parque Municipal: Museu Vivo do Garimpo, Piabinha e Tiburtino", "items": ["O parque fica na saída para Andaraí, a menos de 2 km do centro. <strong>Um ingresso cobre tudo<\/strong>: o museu, a trilha do Projeto Sempre-Viva e as duas cachoeiras.", "O Museu Vivo do Garimpo é montado numa toca de garimpeiro restaurada, com diamantes, carbonados e máquinas de lapidação inglesas do século XIX.", "A Cachoeira da Piabinha fica a poucos minutos a pé da sede. O Tiburtino vem depois, a uns 20 minutos pela mesma trilha, larga e praticamente plana — tem poço raso de um lado e fundo do outro.", "Aberto das 8h30 às 17h30 — <strong>mas hoje o grupo sai às 12h30<\/strong>, porque a tarde termina em Ibicoara.", "💡 Roupa de banho na mochila, e malas já prontas no quarto.", "📍 <a href=\"https://www.google.com/maps/dir/Mucug%C3%AA%2C%20BA/Parque%20Municipal%20de%20Mucug%C3%AA%2C%20BA\" target=\"_blank\">Google Maps<\/a>"], "price": {"text": "R$ 20 por pessoa", "status": "cotado", "source": "parque-mucuge"}, "attraction": "parque-municipal-mucuge"}, {"time": "12h30 – 14h · ALMOÇO", "title": "🍽️ Almoço no centro e check-out", "items": ["Almoço no centro histórico e check-out da pousada. As malas vão para o carro.", "💡 O dia é curto de propósito: vem antes do Buracão."]}, {"time": "14h – 15h · TARDE", "title": "⛪ Cemitério Bizantino (Santa Isabel) à luz do dia", "items": ["Mausoléus brancos em estilo bizantino, com torres e cruzes em miniatura, encravados ao pé do paredão de pedra. Construído entre 1850 e 1886, é apontado como único nas Américas nesse estilo.", "Fica na beira da BA-142, em frente a uma das entradas da cidade. Entrada gratuita, sem guia, visita rápida.", "💡 Vocês já o viram iluminado na noite de segunda — hoje é a visita de perto, antes de pegar a estrada."], "price": {"text": "gratuito", "status": "cotado", "source": "cemiterio-bizantino"}, "attraction": "cemiterio-bizantino"}, {"time": "15h30 – 16h40 · FIM DE TARDE", "title": "🚗 Mucugê → Ibicoara", "items": ["<strong>Mudança de base no fim do dia<\/strong>, para que amanhã a manhã comece já na cidade do Buracão.", "BA-142 sentido sul, asfalto do começo ao fim.", "✅ Saindo às 15h30, a chegada é às 16h40 — <strong>uma hora inteira antes do pôr do sol das 17h42<\/strong>. Nenhum trecho no escuro.", "⚠️ Último horário seguro de saída: 16h30, que ainda chega às 17h36, na luz.", "📍 <a href=\"https://www.google.com/maps/dir/Mucug%C3%AA%2C%20BA/Ibicoara%2C%20BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "78,2 km · 1h06", "status": "cotado", "source": "rotas-maps"}}, {"time": "16h40 – 19h · CHEGADA", "title": "🏨 Check-in em Ibicoara", "items": ["Base das duas próximas noites — <strong>a única da viagem em que não se troca de cama<\/strong>.", "⚠️ Confirmar com o condutor da ACVIB o ponto de encontro de amanhã, agora em Ibicoara mesmo.", "Cidade pequena, de pousadas simples. Volta pela praça e jantar no centro.", "⚠️ A <strong>Pousada Capão do Mel<\/strong> fica na zona rural, a 4,1 km do centro — o jantar é de carro."], "attraction": "ibicoara"}, {"time": "19h em diante · NOITE", "title": "🌙 Jantar em Ibicoara", "items": ["A pousada fica a <strong>4,1 km do centro<\/strong>, na zona rural: o jantar na vila é de carro."], "price": {"text": "R$ 580 o quarto · 2 noites", "status": "confirmado", "source": "reserva-ibicoara"}}]}, {"num": 5, "date": "2026-10-21", "emoji": "🏞️", "city": "Ibicoara", "title": "Buracão sem corrida, café e morango", "route": "Ibicoara → Buracão → Ibicoara", "location": "ibicoara", "blocks": [{"time": "07h30 – 08h · MANHÃ", "title": "☕ Café e encontro com o condutor", "items": ["Café na pousada, sem pressa. As malas ficam — hoje se volta para a mesma cama.", "⚠️ Encontro com o condutor da Associação dos Condutores de Visitantes de Ibicoara (ACVIB), combinado na véspera."]}, {"time": "08h – 09h · MANHÃ", "title": "🚗 Ibicoara → portaria do Buracão", "items": ["São 28 km de estrada de terra até a portaria do parque.", "✅ <strong>Última entrada às 11h — chegando às 9h, sobram 2h de margem.<\/strong> Dormir em Ibicoara tirou 1h06 de asfalto da frente do passeio.", "⚠️ As fontes divergem no horário de fechamento (15h ou 17h) — confirmar com o condutor.", "📍 <a href=\"https://www.google.com/maps/dir/Ibicoara%2C%20BA/Cachoeira%20do%20Burac%C3%A3o%2C%20Ibicoara%2C%20BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "~28 km de terra · ~1h", "status": "estimado", "source": "rotas-osrm"}}, {"time": "09h – 13h · DIA", "title": "🏞️ Cachoeira do Buracão", "items": ["O programa mais impressionante da viagem, e o ponto em que as fontes mais concordam.", "3 km de trilha por sentido, descrita como de leve a moderada e quase toda plana — cerca de 1h de caminhada até a queda de 85 m dentro do cânion.", "💡 No trecho final cada um escolhe: entrar nadando pelo cânion até o pé da queda, ou ficar no mirante. Não precisa ser unânime.", "⚠️ Sapatilha aquática, água e lanche. Não há estrutura na trilha."], "price": {"text": "guia R$ 150–200 por grupo · ingresso ~R$ 30 por pessoa", "status": "estimado", "source": "buracao"}, "attraction": "cachoeira-do-buracao"}, {"time": "13h – 14h · VOLTA", "title": "🚗 Buracão → Ibicoara", "items": ["Os 28 km de terra com sol alto e folga larga.", "⚠️ As fontes locais são consistentes: 28 a 30 km de chão, de 40 min a 1h. O Google Maps mede 89 km e 2h40 porque desvia pelo asfalto — <strong>seguir o condutor, não o aplicativo<\/strong>."], "duration": {"text": "~28 km de terra · ~1h", "status": "estimado", "source": "buracao"}}, {"time": "14h – 15h15 · ALMOÇO", "title": "🍽️ Almoço tardio no centro de Ibicoara", "items": ["Volta do Buracão e almoço sem pressa na vila — hoje não há estrada depois.", "💡 O Sítio Canjerana é às 15h30, a poucos minutos daqui."]}, {"time": "15h30 – 17h30 · TARDE", "title": "🍓 Café e morango no Sítio Canjerana", "items": ["Colheita de morango direto do pé, trilha pelo cafezal sombreado e degustação de café especial na cafeteria do sítio. Cerca de 2h.", "Fica na beira da rodovia, a poucos minutos do centro de Ibicoara.", "⚠️ <strong>Exige agendamento.<\/strong> Pedir um horário depois das 15h pelo Instagram <a href=\"https://www.instagram.com/cafe_canjerana/\" target=\"_blank\">@cafe_canjerana<\/a>."], "price": {"text": "R$ 80 a primeira pessoa + R$ 50 cada adicional", "status": "estimado", "source": "canjerana"}, "attraction": "sitio-canjerana"}, {"time": "19h em diante · NOITE", "title": "🏘️ Segunda noite em Ibicoara", "items": ["Jantar no centro — são 4,1 km de carro desde a pousada.", "💡 Hoje o grupo volta às 17h30: é a tarde mais livre da viagem depois da manhã de segunda.", "⚠️ <strong>Sexta o carro sai às 7h: 520 km e 7h53 até Juazeiro.<\/strong> Malas prontas hoje à noite."]}]}, {"num": 6, "date": "2026-10-22", "emoji": "💦", "city": "Lençóis", "title": "Direto para a Pratinha", "route": "Ibicoara → Mucugê → Andaraí → BR-242 → Fazenda Pratinha → Lençóis", "location": "lencois-volta", "blocks": [{"time": "08h – 12h · MANHÃ", "title": "🚗 Ibicoara → Fazenda Pratinha (Iraquara)", "items": ["Pelo asfalto: BA-142 de volta por Mucugê e Andaraí, depois BR-242 para o oeste, passando pela entrada de Lençóis e pelo Pai Inácio.", "⚠️ <strong>248 km e 3h49 de volante.<\/strong> Saindo às 8h, com uma parada curta, a chegada fica por volta das 12h.", "⚠️ O Google Maps oferece uma rota mais curta, de 167 km e 3h09, pela serra. É o atalho por Guiné e Palmeiras, com ~60 km de estrada de terra. Fica de fora: seguir pela BR-242.", "💡 Hoje é só a Pratinha: a Lapa Doce e a Torrinha ficaram no domingo.", "📍 <a href=\"https://www.google.com/maps/dir/Ibicoara%2C%20BA/Fazenda%20Pratinha%2C%20Iraquara%2C%20BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "248 km · 3h49 pelo asfalto", "status": "cotado", "source": "rotas-maps-16"}}, {"time": "12h – 16h · DIA", "title": "💦 Fazenda Pratinha e Gruta Azul", "items": ["No complexo ficam o rio de água transparente, a Gruta da Pratinha e a Gruta Azul, com restaurante e cafeteria. A flutuação acontece na Gruta da Pratinha.", "⚠️ <strong>A luz da Gruta Azul em 22/10 é incerta.<\/strong> As fontes divergem no horário (12h30–14h, 14h–15h ou 14h30–15h30) e na época: umas dizem que o fenômeno vai de abril a setembro, outras estendem até outubro. Perguntar à fazenda pelo WhatsApp (75) 9 9946-9933 antes da viagem.", "💡 Chegando por volta das 12h e ficando até as 15h30, o grupo cobre todas as janelas citadas. Se a luz não vier, a luz azul da viagem já terá sido a do Poço Azul, na segunda.", "⚠️ Entrada até as 16h, permanência até as 17h.", "⚠️ <strong>A flutuação é cobrada à parte:<\/strong> R$ 100 por pessoa, além da entrada. Para os quatro com flutuação, são R$ 760."], "price": {"text": "R$ 90 por pessoa · flutuação + R$ 100", "status": "cotado", "source": "fazenda-pratinha"}, "tip": "Luz da Gruta Azul incerta", "attraction": "fazenda-pratinha"}, {"time": "16h – 17h · VOLTA", "title": "🚗 Pratinha → Lençóis", "items": ["⚠️ Sair da Pratinha às 16h — a entrada fecha às 16h e a permanência vai até as 17h, mas o que manda é chegar a Lençóis antes do pôr do sol (17h42). Saindo às 16h, chega-se por volta das 17h10.", "📍 <a href=\"https://www.google.com/maps/dir/Fazenda%20Pratinha%2C%20Iraquara%2C%20BA/Len%C3%A7%C3%B3is%2C%20BA\" target=\"_blank\">Google Maps<\/a> · <a href=\"https://www.waze.com/live-map/directions?to=ll.-12.5614%2C-41.3903\" target=\"_blank\">Waze<\/a>"], "duration": {"text": "48,0 km · 1h10", "status": "cotado", "source": "rotas-maps-16"}}, {"time": "19h em diante · NOITE", "title": "🍽️ Última noite na Chapada", "items": ["Lençóis é o melhor polo de comida do roteiro — a despedida é aqui.", "💡 Sexta o carro sai às 7h."], "options": [{"title": "Lampião Cozinha Nordestina", "text": "Moquecas e carne de sol."}, {"title": "Garimpo Gourmet", "text": "Comida regional farta."}, {"title": "Cozinha Aberta", "text": "Outra opção no centro de Lençóis."}, {"title": "Bistrô do Mato", "text": "Massas e pratos leves, para quem chegar cansado."}], "attraction": "jantar-despedida"}]}, {"num": 7, "date": "2026-10-23", "emoji": "🏠", "city": "Juazeiro", "title": "A volta por Morro do Chapéu", "route": "Lençóis → Morro do Chapéu → Jacobina → Juazeiro", "blocks": [{"time": "07h · SAÍDA", "title": "🚗 Lençóis → Morro do Chapéu", "items": ["⚠️ <strong>A conta da volta foi refeita no Google Maps em 12/10 e não fecha com o que estava aqui.<\/strong> Pela BA-142 e BA-144, passando por Morro do Chapéu e Jacobina, são <strong>520 km e 7h53 de volante<\/strong> — não os 489 km e 7h10 que o roteiro trazia. Os 489 km são da rota direta pela BR-242, a mesma da ida, que não passa por Morro do Chapéu.", "💡 Por isso a saída desceu das 8h para as <strong>7h<\/strong>. Com 7h53 ao volante, uma parada na cachoeira e um almoço, 8h de saída significaria chegar depois das 18h30.", "Lençóis → Morro do Chapéu: 176 km e 2h40 pela BA-142 e BA-144. Chegada por volta das 9h40.", "📍 <a href=\"https://www.google.com/maps/dir/Len%C3%A7%C3%B3is%2C+BA/Morro+do+Chap%C3%A9u%2C+BA/Jacobina%2C+BA/Juazeiro%2C+BA\" target=\"_blank\">Google Maps<\/a>"], "duration": {"text": "520 km · 7h53 no total do dia", "status": "cotado", "source": "rotas-maps"}, "tip": "Saída às 7h"}, {"time": "09h40 – 10h45 · PARADA OPCIONAL", "title": "💦 Cachoeira do Ferro Doido, em Morro do Chapéu", "items": ["A cachoeira fica 18 km adiante do centro, uns 25 minutos — cânion de mais de 100 m, com 650 m de caminhada do estacionamento.", "⚠️ <strong>Em outubro ela pode estar seca.<\/strong> Os relatos são consistentes: fora da estação chuvosa é raro ter água. Vale como aposta de 40 minutos, não como programa contado.", "⚠️ <strong>Esta parada custa cerca de 1h ao dia<\/strong> — com ela a chegada em casa fica perto das 17h40; sem ela, por volta das 16h30. Decidir na hora, pelo relato de quem estiver em Morro do Chapéu."], "duration": {"text": "176 km de Lençóis · 2h40", "status": "cotado", "source": "rotas-maps"}}, {"time": "12h30 – 13h45 · ALMOÇO", "title": "🍽️ Almoço em Jacobina", "items": ["Morro do Chapéu → Jacobina: 108 km e 1h30 pela BA-144. É a melhor estrutura da volta e o encaixe natural do horário.", "⚠️ <strong>Falta escolher o restaurante<\/strong> — a aba de restaurantes tem a lista da estrada.", "💡 Abastecer aqui: o próximo trecho são 236 km seguidos."], "duration": {"text": "108 km de Morro do Chapéu · 1h30", "status": "cotado", "source": "rotas-maps"}}, {"time": "17h30 · CHEGADA", "title": "🏠 Juazeiro", "items": ["Jacobina → Juazeiro: <strong>236 km e 3h43<\/strong> pela BA-131 e BR-407. É o trecho mais longo da volta, e o roteiro antigo o subestimava em mais de uma hora.", "💡 Com a parada no Ferro Doido, chegada por volta das 17h30; sem ela, por volta das 16h30. Nos dois casos ainda com luz — o pôr do sol é às 17h42.", "🍣 O jantar da chegada é o sushi em Juazeiro, e o fim de semana em casa começa aqui."], "duration": {"text": "236 km de Jacobina · 3h43", "status": "cotado", "source": "rotas-maps"}}, {"time": "ALTERNATIVA · DECIDIR NA VÉSPERA", "title": "🔀 Voltar pela BR-242, sem Morro do Chapéu", "items": ["Existe o caminho direto, o mesmo da ida ao contrário. É mais curto e mais rápido, mas não tem cachoeira nem Jacobina."], "options": [{"title": "Por Morro do Chapéu e Jacobina (o plano)", "text": "520 km e 7h53. Saída às 7h, Ferro Doido opcional, almoço em Jacobina, chegada entre 16h30 e 17h30. Estradas estaduais, mais curvas e menos movimento.", "price": {"text": "520 km · 7h53", "status": "cotado", "source": "rotas-maps"}}, {"title": "Direto pela BR-242 e BR-407", "text": "489 km e cerca de 7h — 31 km e quase uma hora a menos. Sai por Seabra e v
